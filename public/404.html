<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24342f">
<title>KIVI STORE — Halaman Tidak Ditemukan</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:24px;
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#24342f;
 background:linear-gradient(135deg,#f8fffc,#edf8f4)
}
.box{
 width:min(520px,100%);
 text-align:center;
 background:white;
 padding:40px 25px;
 border-radius:30px;
 box-shadow:0 20px 60px #527f7020;
 border:1px solid #dcece6
}
.icon{font-size:70px}
h1{font-size:42px;margin:10px 0}
p{color:#71827c;line-height:1.7}
a{
 display:inline-block;
 margin-top:15px;
 padding:13px 20px;
 border-radius:14px;
 background:#24342f;
 color:white;
 text-decoration:none;
 font-weight:800
}
</style>
</head>
<body>
<div class="box">
<div class="icon">🥝</div>
<h1>Oops!</h1>
<p>Halaman yang kamu cari tidak ditemukan.</p>
<a href="/">← Kembali ke KIVI STORE</a>
</div>
</body>
</html>
